org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
# AGP is fixed by the included build; run a metadata-compatible standalone lint.
android.experimental.lint.version=8.13.2
# Lint 8.13 K2 UAST crashes while analyzing Gradle Kotlin scripts.
android.lint.useK2Uast=false
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.experimental.lint.version,android.lint.useK2Uast
