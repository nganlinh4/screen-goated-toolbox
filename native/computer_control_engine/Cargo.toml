[package]
name = "sgt-computer-control-engine"
version = "1.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde_json = "1.0"
sgt-computer-control-protocol = { path = "../computer_control_protocol" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
