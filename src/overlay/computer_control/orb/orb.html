<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CC Assistant orb</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100vw; height:100vh; overflow:hidden; background:transparent; pointer-events:none; }
  body { font-family:'Google Sans Flex','Google Sans','Product Sans',system-ui,'Segoe UI',sans-serif;
         color:#eef0f6; -webkit-font-smoothing:antialiased; user-select:none; }
  /*FONT_CSS*/
  #c { position:fixed; inset:0; display:block; touch-action:none; pointer-events:auto; }
  #caption { position:fixed; right:0; bottom:0; text-align:right; pointer-events:none;
             font-size:17px; font-weight:450; line-height:1.32;
             text-shadow:0 2px 18px rgba(0,0,0,.92),0 0 10px rgba(0,0,0,.65); }
  #caption .w { display:inline-block; opacity:0; transform:translateY(10px); filter:blur(6px);
                animation:wordin .5s cubic-bezier(.2,.8,.2,1) forwards; margin-right:.28em; }
  @keyframes wordin { to { opacity:1; transform:none; filter:blur(0); } }
  #glyph { position:fixed; left:0; top:0; z-index:2; color:#07070b; opacity:0;
           pointer-events:none; will-change:transform,opacity; }
  #glyph svg { width:100%; height:100%; display:block; fill:currentColor; }
  /* the typed-command box: click the orb to type a command instead of speaking */
  #cmd { position:fixed; pointer-events:auto; display:none; z-index:4; font-family:inherit;
         font-size:15px; font-weight:450; color:#eef0f6; background:rgba(16,16,26,.82);
         -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
         border:1px solid rgba(255,255,255,.18); border-radius:13px; padding:10px 15px;
         outline:none; caret-color:#9db4ff; box-shadow:0 12px 36px rgba(0,0,0,.55); }
  #cmd::placeholder { color:rgba(238,240,246,.42); }
</style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="glyph"></div>
  <div id="caption"></div>
  <input id="cmd" type="text" placeholder="/*CMD_PLACEHOLDER*/" autocomplete="off" autocorrect="off" spellcheck="false" />

<script>
(() => {
  const TAU=Math.PI*2;
  const cv=document.getElementById('c'), ctx=cv.getContext('2d');
  const oc=document.createElement('canvas'), octx=oc.getContext('2d');   // offscreen: the sharp body masked per-angle
  const capEl=document.getElementById('caption'), glyphEl=document.getElementById('glyph'), cmdEl=document.getElementById('cmd');
  let W,H,DPR,mag=0.18;                          // small corner orb (Rust can override via configurePlacement)
  let CX_FRAC=0.9, CY_FRAC=0.86;                 // default bottom-right
  // window.cc.moveTo glides the orb to a new corner (dodge the agent / return home): a smoothstep
  // tween of the anchor, with the orb locked to it (spring bypassed) so the moving region never clips it.
  let CX_TARGET=CX_FRAC, CY_TARGET=CY_FRAC, relocFromX=CX_FRAC, relocFromY=CY_FRAC, relocT=0, relocating=false;
  function resize(){ DPR=Math.min(devicePixelRatio||1,1.5); W=innerWidth; H=innerHeight;   // cap DPR: the canvas spans the whole virtual screen
    cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); cv.style.width=W+'px'; cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0);
    oc.width=cv.width; oc.height=cv.height; reportRegion(); }
  addEventListener('resize',resize);

  const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
  function hash(n){const s=Math.sin(n)*43758.5453;return s-Math.floor(s);}
  function noise1(x){const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return lerp(hash(i),hash(i+1),u)*2-1;}

  // LIQUID blob: radius = a sum of angular harmonics whose phases TRAVEL around the rim over time
  // (`ph`), interfering so lobes appear, swell, merge and vanish (metaball-like). `rot` adds a smooth
  // swirl. Crisp vector path at any zoom. `amp` = deformation depth.
  function blobPath(cx,cy,R,ph,amp,rot){
    const M=96, P=new Path2D();
    const pt=i=>{ const phi=i/M*TAU, a=phi-rot;
      const r=R*(1 + amp*( 0.26*Math.sin(a*2 + ph*0.9)
                         + 0.52*Math.sin(a*3 - ph*0.7 + 0.6)
                         + 0.36*Math.sin(a*4 + ph*1.2 + 1.7) ));
      return [cx+Math.cos(phi)*r, cy+Math.sin(phi)*r]; };
    const a0=pt(M-1), b0=pt(0); P.moveTo((a0[0]+b0[0])/2,(a0[1]+b0[1])/2);
    for(let i=0;i<M;i++){ const c=pt(i), n=pt((i+1)%M); P.quadraticCurveTo(c[0],c[1],(c[0]+n[0])/2,(c[1]+n[1])/2); }
    return P;
  }
  const STOPS=[0,.34,.62,.85,1];
  function gradFrom(cx,cy,s,ang,pal,br){ const r=s*.85,gx=Math.cos(ang)*r,gy=Math.sin(ang)*r,g=ctx.createLinearGradient(cx-gx,cy-gy,cx+gx,cy+gy);
    for(let i=0;i<5;i++){ const c=pal[i], R=br?lerp(c[0],255,.3):c[0], G=br?lerp(c[1],255,.3):c[1], B=br?lerp(c[2],255,.3):c[2];
      g.addColorStop(STOPS[i],`rgb(${R|0},${G|0},${B|0})`); } return g; }

  // ---- per-state look: icon + undulation depth (amp) + churn speed (flow) + swirl direction (dir)
  //      + edge-blur character (blur) + glow + palette. Driven from Rust via window.cc.setState(label).
  function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  // Downloaded Material Symbols (ui-shared/material-symbols, scripts/download_material_symbols.sh).
  // Each host fills the slot markers: Windows orb/glyphs.rs, Android PhoneControlOrbView. Rendered in #glyph.
  const ICONS={emoji_objects:'<!--sgt-material-symbol:emoji_objects-->',keyboard:'<!--sgt-material-symbol:keyboard-->',location_searching:'<!--sgt-material-symbol:location_searching-->',my_location:'<!--sgt-material-symbol:my_location-->',person_celebrate:'<!--sgt-material-symbol:person_celebrate-->',keyboard_double_arrow_left:'<!--sgt-material-symbol:keyboard_double_arrow_left-->',keyboard_double_arrow_right:'<!--sgt-material-symbol:keyboard_double_arrow_right-->',keyboard_double_arrow_up:'<!--sgt-material-symbol:keyboard_double_arrow_up-->',table_eye:'<!--sgt-material-symbol:table_eye-->',hov:'<!--sgt-material-symbol:hov-->',graph_1:'<!--sgt-material-symbol:graph_1-->',graph_2:'<!--sgt-material-symbol:graph_2-->',graph_3:'<!--sgt-material-symbol:graph_3-->',graph_4:'<!--sgt-material-symbol:graph_4-->',graph_5:'<!--sgt-material-symbol:graph_5-->',graph_6:'<!--sgt-material-symbol:graph_6-->',graph_7:'<!--sgt-material-symbol:graph_7-->',hourglass_bottom:'<!--sgt-material-symbol:hourglass_bottom-->',hourglass_top:'<!--sgt-material-symbol:hourglass_top-->',cognition:'<!--sgt-material-symbol:cognition-->',bug_report:'<!--sgt-material-symbol:bug_report-->',frame_bug:'<!--sgt-material-symbol:frame_bug-->',eyeglasses_2:'<!--sgt-material-symbol:eyeglasses_2-->',eyeglasses_3:'<!--sgt-material-symbol:eyeglasses_3-->',sentiment_calm:'<!--sgt-material-symbol:sentiment_calm-->',sentiment_content:'<!--sgt-material-symbol:sentiment_content-->',sentiment_dissatisfied:'<!--sgt-material-symbol:sentiment_dissatisfied-->',sentiment_extremely_dissatisfied:'<!--sgt-material-symbol:sentiment_extremely_dissatisfied-->',sentiment_neutral:'<!--sgt-material-symbol:sentiment_neutral-->',sentiment_sad:'<!--sgt-material-symbol:sentiment_sad-->',sentiment_satisfied:'<!--sgt-material-symbol:sentiment_satisfied-->',sentiment_stressed:'<!--sgt-material-symbol:sentiment_stressed-->',sentiment_very_dissatisfied:'<!--sgt-material-symbol:sentiment_very_dissatisfied-->',sentiment_very_satisfied:'<!--sgt-material-symbol:sentiment_very_satisfied-->',sentiment_worried:'<!--sgt-material-symbol:sentiment_worried-->',sentiment_excited:'<!--sgt-material-symbol:sentiment_excited-->',sentiment_frustrated:'<!--sgt-material-symbol:sentiment_frustrated-->',graphic_eq:'<!--sgt-material-symbol:graphic_eq-->',lightbulb:'<!--sgt-material-symbol:lightbulb-->',visibility:'<!--sgt-material-symbol:visibility-->',arrow_selector_tool:'<!--sgt-material-symbol:arrow_selector_tool-->',rtt:'<!--sgt-material-symbol:rtt-->',gesture:'<!--sgt-material-symbol:gesture-->',keyboard_double_arrow_down:'<!--sgt-material-symbol:keyboard_double_arrow_down-->',backlight_high:'<!--sgt-material-symbol:backlight_high-->',globe_asia:'<!--sgt-material-symbol:globe_asia-->',person_play:'<!--sgt-material-symbol:person_play-->',terminal:'<!--sgt-material-symbol:terminal-->',comment:'<!--sgt-material-symbol:comment-->',check_small:'<!--sgt-material-symbol:check_small-->'};
  const STATES=[
    {label:'idle',       icon:null,                  amp:0.060, flow:0.50, dir: 1, blur:0.25, glow:1.00,           pal:['#2b6cff','#566bff','#8a6cf0','#a98cf5','#c2acff']},
    {label:'thinking',   swing:1, icon:'emoji_objects',           amp:0.140, flow:2.00, dir: 1, blur:1.05, glow:1.25,           pal:['#1fd0e6','#3b8cff','#7b6cff','#b557ef','#e85bd0']},
    {label:'look',       swing:1, icon:['eyeglasses_2','eyeglasses_3'], loopMs:650,          amp:0.085, flow:0.80, dir:-1, blur:0.62, glow:1.10,           pal:['#5b6cff','#3b8cff','#1fb0e6','#3bd0c8','#6fe6b0']},
    {label:'click',      icon:'arrow_selector_tool', amp:0.085, flow:1.45, dir: 1, blur:0.40, glow:1.00,           pal:['#3b8cff','#5b78ff','#8a6cf0','#b06ce0','#d98cff']},
    {label:'type',       icon:'keyboard',                 amp:0.070, flow:1.05, dir:-1, blur:0.35, glow:1.00,           pal:['#3bb0ff','#4b9cff','#6f8cff','#9b7cf0','#c78ce8']},
    {label:'drag',       icon:'gesture',             amp:0.125, flow:1.15, dir: 1, blur:0.55, glow:1.05,           pal:['#9b6cff','#b15cf0','#d04ce0','#e25bb0','#ff7c9c']},
    {label:'scroll',     icon:'keyboard_double_arrow_down', amp:0.100, flow:1.65, dir:-1, blur:0.50, glow:1.00,           pal:['#2fd0c8','#1fc8e6','#3b9cff','#6f8cff','#9b8cf0']}, // single icon; set_orb_tool picks the direction arrow
    {label:'point',      icon:['location_searching','my_location'], loopMs:600,      amp:0.070, flow:0.90, dir: 1, blur:0.45, glow:1.08,           pal:['#ffc24d','#ff9a5c','#ff6f8e','#e25bb0','#b15cf0']},
    {label:'navigate',   icon:'globe_asia',          amp:0.105, flow:1.50, dir:-1, blur:0.60, glow:1.05,           pal:['#3bd98c','#2fc8c8','#1fb0e6','#3b8cff','#7b7cf0']},
    {label:'launch',     icon:['person_play','person_celebrate'], loopMs:520,         amp:0.130, flow:1.75, dir: 1, blur:0.72, glow:1.20,           pal:['#ff9a3d','#ff7c5c','#ff5c8a','#e25bb0','#b15cf0']},
    {label:'run',        swing:1, icon:'terminal',            amp:0.090, flow:1.35, dir:-1, blur:0.45, glow:1.00,           pal:['#5be67c','#2fd96b','#1fc8a0','#2fb0d6','#4b9cff']},
    {label:'responding', icon:'sentiment_neutral',   amp:0.110, flow:1.25, dir: 1, blur:0.78, glow:1.05, live:true, pal:['#2fd39b','#1fc8d6','#3b8cff','#7b6cff','#b15cf0']},
    {label:'done',       icon:'check_small',         amp:0.060, flow:0.60, dir:-1, blur:0.30, glow:1.12,           pal:['#2fd98c','#2fd3b0','#3bd0d6','#4bb0e6','#6f9cff']},
    {label:'error',      icon:null,                  amp:0.120, flow:0.95, dir: 1, blur:0.55, glow:1.12,           pal:['#ff5c5c','#ff6f7c','#ff8a6c','#ff6f8e','#e25b8a']},
    {label:'observe',    swing:1, icon:'table_eye',           amp:0.085, flow:0.90, dir:-1, blur:0.55, glow:1.10,           pal:['#3bd0e6','#3b9cff','#5b7cff','#7b6cf0','#9b8cf0']},
    {label:'act',        icon:'hov',                 amp:0.090, flow:1.40, dir: 1, blur:0.42, glow:1.02,           pal:['#3b8cff','#5b78ff','#8a6cf0','#b06ce0','#d98cff']},
    {label:'do_steps',   swing:1, icon:['graph_1','graph_2','graph_3','graph_4','graph_5','graph_6','graph_7'], loopMs:300, amp:0.105, flow:1.60, dir:-1, blur:0.48, glow:1.08, pal:['#2fd98c','#2fd3b0','#1fc8d6','#3b9cff','#6f8cff']},
    {label:'wait',       swing:1, icon:['hourglass_bottom','hourglass_top'], loopMs:720, amp:0.050, flow:0.45, dir: 1, blur:0.40, glow:0.95, pal:['#ffc24d','#ffb073','#ff9a5c','#f0a86c','#d9b08c']},
    {label:'memory',     swing:1, icon:'cognition',           amp:0.100, flow:1.05, dir:-1, blur:0.60, glow:1.10,           pal:['#9b6cff','#b15cf0','#c75ce8','#d04ce0','#e25bb0']},
    {label:'console',    icon:['bug_report','frame_bug'], loopMs:600, amp:0.085, flow:1.20, dir: 1, blur:0.45, glow:1.00, pal:['#5be67c','#2fd96b','#1fc8a0','#2fb0d6','#4b9cff']},
  ];
  STATES.forEach(s=>s.rgb=s.pal.map(hx));
  const LABELS={}; STATES.forEach((s,i)=>LABELS[s.label]=i);
  let idx=0,tNow=0,curIcon=null,tgtIcon=null,surface=0,iconStep=0,iconTimer=0,iconOverride=null,swingC=0,stateAge=0;
  const SWING_DELAY=2.5, SWING_RAMP=2.0; // a long process must run 2.5s before it sways, then the sway eases in over 2.0s (never abrupt)
  let ampC=STATES[0].amp, flowC=STATES[0].flow, dirC=STATES[0].dir, blurC=STATES[0].blur, glow=STATES[0].glow, curPal=STATES[0].rgb.map(c=>c.slice());
  let audio=0,audioT=0,liveNow=false, audioExt=0, audioExtActive=false;
  let captionText="";
  // The caption mirrors SPEECH, so strip the markdown the model habitually emits (**bold**, *italic*,
  // `code`, # headers, - bullets) → clean friendly text instead of raw syntax. Tolerant of the streaming
  // partial (e.g. "**Fed" before its closer arrives) - the straggler pass removes lone * _ # too.
  function stripMd(s){ return (s||'')
    .replace(/`{1,3}/g,'')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/\*([^*]+)\*/g,'$1')
    .replace(/^\s*#{1,6}\s+/gm,'')
    .replace(/^\s*[-*•]\s+/gm,'')
    .replace(/[*_#`]/g,'')
    .replace(/\n{2,}/g,'\n').trim(); }
  function enter(i){ const ni=(i+STATES.length)%STATES.length;
    if(ni!==idx){ stateAge=0; iconStep=0; iconTimer=0; iconOverride=null; } // reset ONLY on a real state change - keeps the swing clock + live sentiment glyph through repeated same-state setState() calls
    idx=ni; const c=STATES[idx]; liveNow=!!c.live;
    tgtIcon=Array.isArray(c.icon)?c.icon[0]:c.icon; }
  // Incremental: as the transcript GROWS, keep the words already shown and only animate the new tail
  // (Live-Translate style) — so the full reply stays on screen instead of cutting to just the last words.
  function renderCaption(){ const words=(captionText||'').split(/\s+/).filter(Boolean);
    const reset = words.length===0 || (capEl.children[0] && capEl.children[0].textContent!==words[0]);
    if(reset) capEl.innerHTML='';
    for(let i=0;i<words.length;i++){ const c=capEl.children[i];
      if(c){ if(c.textContent!==words[i]) c.textContent=words[i]; }   // mid-word growth: update in place
      else { const sp=document.createElement('span'); sp.className='w'; sp.textContent=words[i];
        sp.style.animationDelay=(reset?i*.045:0)+'s'; capEl.appendChild(sp); } }
    while(capEl.children.length>words.length) capEl.removeChild(capEl.lastChild);
    reportRegion(); }   // caption changed → reposition it and refresh the visible/clickable region

  let last=performance.now();
  // appear/dismiss: a small orb flies in from the NEAREST screen edge, blooms; on dismiss it flies back out.
  let vis='gone', vp=0; const ENTER=1.05, EXIT=0.74;
  let oscS={x:0.24,v:0}, flowPhase=0, flowBurst=5, rotPhase=0, pS={x:0,y:0,vx:0,vy:0}, reseed=true, launchOut=false;
  let dragging=false, dragDX=0, dragDY=0, cmdOpen=false;

  // off-screen point just past the nearest screen edge, aligned with the orb (for fly in/out)
  function nearestEdge(){
    const ox=W*CX_FRAC, oy=H*CY_FRAC;
    const m=Math.min(ox, W-ox, oy, H-oy);
    if(m===W-ox) return [W*1.12, oy];
    if(m===ox)   return [-W*0.12, oy];
    if(m===H-oy) return [ox, H*1.12];
    return [ox, -H*0.12];
  }

  function step(dt){ tNow+=dt;
    if(vis==='in'){ vp=Math.min(1,vp+dt/ENTER); if(vp>=1){vis='live'; reportRegion();} }  // settled → snap region from full window back to the tight orb box
    else if(vis==='out'){ vp=Math.min(1,vp+dt/EXIT); if(vp>=1){vis='gone';} }
    // 'live' and 'gone' are steady — only window.cc.show()/hide() change them.
    // Relocating (dodge / return-home): ease the anchor; the orb is locked to it below (no spring lag)
    // and the region is reported every frame so the tight box tracks the glide — clicks outside the orb
    // keep passing through to the desktop the whole way.
    if(relocating && !dragging){
      relocT=Math.min(1, relocT+dt/0.42);
      const e=relocT*relocT*(3-2*relocT);
      CX_FRAC=relocFromX+(CX_TARGET-relocFromX)*e;
      CY_FRAC=relocFromY+(CY_TARGET-relocFromY)*e;
      if(relocT>=1){ CX_FRAC=CX_TARGET; CY_FRAC=CY_TARGET; relocating=false; }
      reportRegion();
    }

    const S=STATES[idx], k=Math.min(1,dt*3.3);
    ampC+=(S.amp-ampC)*k; flowC+=(S.flow-flowC)*k; dirC+=(S.dir-dirC)*k; blurC+=(S.blur-blurC)*k; glow+=(S.glow-glow)*k;
    stateAge+=dt; // seconds in the current state
    // Pendulum sway ONLY on long "processing" states (thinking/look/observe/do_steps/run/wait/memory) AND only once
    // they've run past SWING_DELAY - so a quick think never twitches. smoothstep onset + the lerp = a seamless ease-in.
    const swT=S.swing?Math.max(0,Math.min(1,(stateAge-SWING_DELAY)/SWING_RAMP)):0;
    swingC+=(swT*swT*(3-2*swT)-swingC)*k;
    for(let i=0;i<5;i++) for(let j=0;j<3;j++) curPal[i][j]+=(S.rgb[i][j]-curPal[i][j])*k;
    // Drive the target glyph: a setIcon override (e.g. live sentiment) wins; else an
    // array-icon state cycles its frames every loopMs; else the static icon.
    let cut=false;
    if(iconOverride!=null){ tgtIcon=iconOverride; cut=true; }   // sentiment (override) changes hard-CUT too, no crossfade
    else if(Array.isArray(S.icon)){ iconTimer+=dt; const sec=(S.loopMs||600)/1000;
      if(iconTimer>=sec){ iconTimer-=sec; iconStep=(iconStep+1)%S.icon.length; cut=true; }
      tgtIcon=S.icon[iconStep]; }
    else tgtIcon=S.icon;
    if(curIcon!==tgtIcon){
      if(cut){ curIcon=tgtIcon; surface=1; }   // loop frame advance -> hard CUT at full size (no scale/fade), for snappy expressiveness
      else { surface=Math.max(0,surface-dt/0.26); if(surface<=0.001) curIcon=tgtIcon; }   // state change still cross-fades
    }
    else if(curIcon) surface=Math.min(1,surface+dt/0.34); else surface=Math.max(0,surface-dt/0.2);
    if(audioExtActive){ audioT=audioExt; } else audioT=0;
    audio+=(audioT-audio)*Math.min(1,dt*12);

    flowBurst*=Math.exp(-1.7*dt);
    flowPhase += (flowC + flowBurst)*dt;
    rotPhase  += (dirC*(0.13 + flowC*0.20) + 0.10*noise1(tNow*0.05+7))*dt;
    const base=Math.min(W,H)*0.16*mag, breathe=1+0.03*Math.sin(tNow*1.4)+0.35*audio; // volume -> strong size pulse
    let R=base*breathe, ang=-0.6;
    const fcx=W*CX_FRAC + noise1(tNow*0.13)*17 + Math.sin(tNow*0.43)*10;
    const fcy=H*CY_FRAC + noise1(60+tNow*0.11)*15 + Math.sin(tNow*0.57+1.3)*11;
    const EDGE=nearestEdge();
    if(reseed){ pS.x=EDGE[0]; pS.y=EDGE[1];
      const dx=fcx-EDGE[0], dy=fcy-EDGE[1], a0=Math.atan2(dy,dx)-0.55, s0=Math.hypot(dx,dy)*1.7;
      pS.vx=Math.cos(a0)*s0; pS.vy=Math.sin(a0)*s0; reseed=false; }
    if(launchOut){ const dx=EDGE[0]-pS.x, dy=EDGE[1]-pS.y, aE=Math.atan2(dy,dx)+0.55, sE=Math.hypot(dx,dy)*1.7;
      pS.vx=Math.cos(aE)*sE; pS.vy=Math.sin(aE)*sE; launchOut=false; }
    if(dragging){ pS.x=W*CX_FRAC; pS.y=H*CY_FRAC; pS.vx=0; pS.vy=0; }
    else if(relocating){ pS.x=fcx; pS.y=fcy; pS.vx=0; pS.vy=0; }  // lock to the tweened anchor so the moving region never clips the orb
    else { const goOut=(vis==='out'||vis==='gone'), ptx=goOut?EDGE[0]:fcx, pty=goOut?EDGE[1]:fcy;
      pS.vx += ((ptx-pS.x)*26 - pS.vx*5.8)*dt; pS.vy += ((pty-pS.y)*26 - pS.vy*5.8)*dt;
      pS.x += pS.vx*dt; pS.y += pS.vy*dt; }
    let cx=pS.x, cy=pS.y;
    const sTgt = vis==='in' ? (vp<0.42?0.24:1) : vis==='out' ? (vp<0.13?1.12:0.16) : vis==='gone' ? 0.16 : 1;
    oscS.v += ((sTgt-oscS.x)*220 - oscS.v*15)*dt; oscS.x += oscS.v*dt;
    let vA = vis==='in' ? Math.min(1,vp/0.1) : vis==='out' ? Math.max(0,1-Math.max(0,(vp-0.72)/0.28)) : vis==='gone' ? 0 : 1;
    R*=oscS.x;
    const amp = ampC + audio*0.15; // volume -> stronger edge wobble
    ctx.clearRect(0,0,W,H);
    if(vA<=0.002){ glyphEl.style.opacity='0'; return; }
    const sh1=0.78+0.30*noise1(tNow*0.7+11), sh2=0.80+0.28*noise1(tNow*0.9+33);
    const haloR=R*(0.5+0.12*noise1(tNow*0.33+50))*(1-audio*0.55);   // glow tightens when LOUD so the pulsed body's halo stays inside the orb window box
    const bigBlob=blobPath(cx,cy,R*1.04,flowPhase,amp,rotPhase), blob=blobPath(cx,cy,R,flowPhase,amp,rotPhase);
    const audioGlow=1+audio*0.9; // volume -> halo brightens
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.filter=`blur(${haloR}px)`; ctx.globalAlpha=Math.min(1,0.26*glow*audioGlow)*vA*sh1;
    ctx.fillStyle=gradFrom(cx,cy,R,ang,curPal,true); ctx.fill(bigBlob); ctx.restore();
    ctx.save(); ctx.globalCompositeOperation='lighter'; ctx.filter=`blur(${R*0.22*(1-audio*0.45)}px)`; ctx.globalAlpha=Math.min(1,0.46*glow*audioGlow)*vA*sh2;
    ctx.fillStyle=gradFrom(cx,cy,R,ang,curPal,true); ctx.fill(bigBlob); ctx.restore();
    const blurAmt=Math.max(0,blurC*(0.65+0.6*noise1(tNow*0.27+40)));
    ctx.save(); ctx.filter=`blur(${R*(0.03+0.16*Math.min(1.2,blurAmt))}px)`; ctx.globalAlpha=vA;
    ctx.fillStyle=gradFrom(cx,cy,R,ang,curPal,false); ctx.fill(blob); ctx.restore();
    // restrict the costly offscreen pass to the orb's bounding box (the canvas spans the whole screen)
    const bx=Math.max(0,(cx-R*2.2)|0), by=Math.max(0,(cy-R*2.2)|0);
    const bw=Math.min(W,Math.ceil(cx+R*2.2))-bx, bh=Math.min(H,Math.ceil(cy+R*2.2))-by;
    octx.setTransform(DPR,0,0,DPR,0,0); octx.clearRect(bx,by,bw,bh); octx.globalCompositeOperation='source-over';
    octx.fillStyle=gradFrom(cx,cy,R,ang,curPal,false); octx.fill(blob);
    octx.globalCompositeOperation='destination-in';
    const eH2=0.30+0.55*noise1(tNow*0.21+2), eH3=0.32+0.55*noise1(tNow*0.17+9), eH5=0.22+0.50*noise1(tNow*0.13+17), eB=0.1+0.5*noise1(tNow*0.10+25);
    const p2=tNow*0.13, p3=1.7-tNow*0.19, p5=0.6+tNow*0.11;
    const cg=octx.createConicGradient(tNow*0.1,cx,cy);
    for(let s=0;s<=24;s++){ const u=s/24, t2=u*TAU;
      const soft=blurAmt*(eB + eH2*Math.sin(t2*2+p2) + eH3*Math.sin(t2*3+p3) + eH5*Math.sin(t2*5+p5));
      cg.addColorStop(u,`rgba(0,0,0,${clamp(1-soft,0,1).toFixed(3)})`); }
    octx.fillStyle=cg; octx.fillRect(bx,by,bw,bh); octx.globalCompositeOperation='source-over';
    if(bw>0&&bh>0){ ctx.save(); ctx.globalAlpha=vA; ctx.drawImage(oc, bx*DPR,by*DPR,bw*DPR,bh*DPR, bx,by,bw,bh); ctx.restore(); }
    if(vis==='live' && curIcon){ const ic=easeOut(surface);
      if(glyphEl.dataset.icon!==curIcon){ glyphEl.dataset.icon=curIcon; const b=ICONS[curIcon];
        glyphEl.innerHTML = b || ''; }
      const sz=R*1.35; glyphEl.style.width=sz+'px'; glyphEl.style.height=sz+'px'; glyphEl.style.left=cx+'px'; glyphEl.style.top=cy+'px';
      const swing=(Math.sin(tNow*2.3)*5 + Math.sin(tNow*1.13+0.7)*2.2)*swingC; // sway, gated to long "processing" states via swingC
      glyphEl.style.transform=`translate(-50%,-50%) rotate(${swing.toFixed(2)}deg) scale(${lerp(0.84,1,ic)})`; glyphEl.style.opacity=String(0.93*ic*vA);
    } else { glyphEl.style.opacity='0'; }
  }
  function easeOut(t){return 1-Math.pow(1-t,3);}
  function frame(now){ const dt=Math.min(.05,(now-last)/1000); last=now; step(dt); requestAnimationFrame(frame); }

  // ---- Rust bridge (wry IPC) ----
  function postIPC(obj){ try{ if(window.ipc&&window.ipc.postMessage) window.ipc.postMessage(JSON.stringify(obj)); }catch(_){} }
  // caption sits just above the orb, right edge near the orb's right, growing leftward (inside the region).
  function positionCaption(){ if(!W) return; const ox=W*CX_FRAC, oy=H*CY_FRAC, Rn=Math.min(W,H)*0.16*mag;
    capEl.style.right=Math.max(8,W-(ox+Rn*1.5))+'px'; capEl.style.bottom=Math.max(8,H-(oy-Rn*1.7))+'px';
    capEl.style.maxWidth=Math.min(ox-24,420)+'px'; }
  // The window region (SetWindowRgn) is the ONLY visible AND clickable area — it clips pixels too — so it
  // must be generous enough that the orb's soft glow fully fades inside it, or you'd see a hard square edge.
  function reportRegion(){ if(!W) return; positionCaption();
    // While flying in/out, drop to the FULL window (orbDrag) so the orb appears from the real SCREEN
    // edge, not the clipped box edge. It snaps back to the tight box when it settles (vis==='live').
    if(vis==='in'||vis==='out'){ postIPC({type:'orbDrag'}); return; }
    const ox=W*CX_FRAC, oy=H*CY_FRAC, Rn=Math.min(W,H)*0.16*mag, RR=Rn*2.4;  // region must COVER the full glow (SetWindowRgn clips visual too)
    let x1=ox-RR, y1=oy-RR, x2=ox+RR, y2=oy+RR;
    const cr=capEl.getBoundingClientRect();
    if(captionText && cr.width>2){ x1=Math.min(x1,cr.left-12); y1=Math.min(y1,cr.top-10); x2=Math.max(x2,cr.right+12); y2=Math.max(y2,cr.bottom+10); }
    if(cmdOpen){ const br=cmdEl.getBoundingClientRect(); if(br.width>2){ x1=Math.min(x1,br.left-12); y1=Math.min(y1,br.top-12); x2=Math.max(x2,br.right+12); y2=Math.max(y2,br.bottom+12); } }
    x1=Math.max(0,x1); y1=Math.max(0,y1); x2=Math.min(W,x2); y2=Math.min(H,y2);
    postIPC({type:'orbRegion', x:x1, y:y1, w:x2-x1, h:y2-y1, viewportW:W, viewportH:H}); }

  // ---- typed command box: click (tap, no drag) the orb to type a command instead of speaking ----
  function positionCmd(){ if(!W) return; const ox=W*CX_FRAC, oy=H*CY_FRAC, Rn=Math.min(W,H)*0.16*mag;
    cmdEl.style.width=clamp(W*0.2,190,300)+'px';
    cmdEl.style.right=Math.max(10,W-(ox+Rn*1.6))+'px';            // right edge near the orb's right
    cmdEl.style.bottom=Math.max(10,H-(oy-Rn*2.0))+'px'; }         // sit just above the orb
  function openCmd(){ if(cmdOpen||vis!=='live') return; cmdOpen=true; positionCmd();
    cmdEl.value=''; cmdEl.style.display='block'; reportRegion(); postIPC({type:'openCommand'});
    setTimeout(()=>{ try{cmdEl.focus();}catch(_){} },0); }        // focus after Rust takes window focus
  function hideBox(){ if(!cmdOpen) return; cmdOpen=false; cmdEl.style.display='none';
    try{cmdEl.blur();}catch(_){} reportRegion(); }                // visual only — Rust restores focus
  function dismissCmd(){ hideBox(); postIPC({type:'closeCommand'}); }   // user-initiated (Esc / Enter)
  function submitCmd(){ const t=(cmdEl.value||'').trim(); if(t) postIPC({type:'command',text:t}); dismissCmd(); }
  cmdEl.addEventListener('keydown', e=>{ e.stopPropagation();
    if(e.key==='Enter'){ e.preventDefault(); submitCmd(); }
    else if(e.key==='Escape'){ e.preventDefault(); dismissCmd(); } });

  // ---- drag (the user repositions the orb; Rust persists it) ----
  let downX=0, downY=0, moved=false;
  cv.addEventListener('pointerdown', e=>{
    const ox=W*CX_FRAC, oy=H*CY_FRAC, RR=Math.min(W,H)*0.16*mag*1.3;  // small grab radius — right on the orb
    if(Math.hypot(e.clientX-ox, e.clientY-oy) <= RR){
      dragging=true; moved=false; downX=e.clientX; downY=e.clientY;
      dragDX=e.clientX-ox; dragDY=e.clientY-oy; try{cv.setPointerCapture(e.pointerId);}catch(_){} }
  });
  cv.addEventListener('pointermove', e=>{
    if(!dragging){ const ox=W*CX_FRAC, oy=H*CY_FRAC, RR=Math.min(W,H)*0.16*mag*1.3;
      cv.style.cursor = (Math.hypot(e.clientX-ox, e.clientY-oy) <= RR) ? 'grab' : 'default'; return; }
    if(!moved && Math.hypot(e.clientX-downX, e.clientY-downY) > 6){   // crossed the threshold → a real drag
      moved=true; cv.style.cursor='grabbing'; postIPC({type:'orbDrag'}); }
    if(moved){ CX_FRAC=clamp((e.clientX-dragDX)/W, 0.06, 0.94); CY_FRAC=clamp((e.clientY-dragDY)/H, 0.08, 0.92); } });
  cv.addEventListener('pointerup', e=>{ if(!dragging) return; dragging=false; cv.style.cursor='grab';
    try{cv.releasePointerCapture(e.pointerId);}catch(_){}
    if(moved){ postIPC({type:'orbMoved', cxFrac:CX_FRAC, cyFrac:CY_FRAC}); reportRegion(); }
    else { cmdOpen ? dismissCmd() : openCmd(); } });   // a tap (no drag) toggles the command box

  // ---- public API driven by Rust evaluate_script ----
  let settleTimer=null;
  window.cc = {
    setState(label){ const i=LABELS[label]; if(i==null) return; enter(i);
      if(settleTimer){ clearTimeout(settleTimer); settleTimer=null; }
      // done/error ease back on their own. 'responding' does NOT auto-clear: the reply AUDIO plays
      // for many seconds after its transcript finishes, so the caption must persist until Rust signals
      // real speech-end (set_model_idle) — otherwise the text vanishes mid-sentence.
      if(label==='done'||label==='error'){
        settleTimer=setTimeout(()=>{ enter(LABELS['idle']); captionText=''; renderCaption(); }, 2600); } },
    setCaption(text){ captionText=stripMd(text); renderCaption(); },
    setAudio(level){ audioExt=clamp(+level||0,0,1); audioExtActive=true; },
    setIcon(name){ iconOverride=(name&&ICONS[name])?name:null; }, // live glyph override (e.g. sentiment); auto-cleared on next setState
    show(){ if(vis==='gone'||vis==='out'){ vis='in'; vp=0; flowBurst=5; reseed=true; } reportRegion(); },
    hide(){ if(cmdOpen) dismissCmd(); if(vis==='in'||vis==='live'){ vis='out'; vp=0; flowBurst=4; launchOut=true; } captionText=""; renderCaption(); },
    configurePlacement(cfg){ cfg=cfg||{}; if(cfg.mag!=null)mag=cfg.mag;
      if(cfg.cxFrac!=null)CX_FRAC=clamp(cfg.cxFrac,0.04,0.96); if(cfg.cyFrac!=null)CY_FRAC=clamp(cfg.cyFrac,0.06,0.94);
      CX_TARGET=CX_FRAC; CY_TARGET=CY_FRAC; relocating=false; reportRegion(); },
    // Glide to a new corner (Rust dodges the orb away from where the agent is about to act, or sends
    // it back home). The spring-bypassed tween (see step) keeps the region locked to the orb en route.
    moveTo(cx,cy){ if(dragging||vis!=='live') return; relocFromX=CX_FRAC; relocFromY=CY_FRAC;
      CX_TARGET=clamp(cx,0.04,0.96); CY_TARGET=clamp(cy,0.06,0.94); relocT=0; relocating=true; },
    closeCmd(){ hideBox(); },   // Rust calls this to hide the box when the cursor leaves the orb
  };

  resize(); enter(0); requestAnimationFrame(frame);
  // Tell Rust the page has parsed + initialised, so it reveals the window only once we can paint our
  // transparent canvas — otherwise the very FIRST show flashes the WebView's white default background.
  postIPC({type:'orbReady'});
})();
</script>
</body>
</html>
