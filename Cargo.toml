[package]
name = "screen-goated-toolbox"
version = "5.4.3"
edition = "2024"
default-run = "screen-goated-toolbox"

[features]
default = []
recorder-worker = []

[build-dependencies]
winres = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
resvg = { version = "0.47", default-features = false }
serde_json = "1.0"

[dependencies]
# Network & Serialization
ureq = { version = "3.2", default-features = false, features = ["json", "native-tls", "gzip"] }
tungstenite = { version = "0.29", features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
sha1 = "0.10"
url = "2.5"
psl2 = "0.1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
base64 = "0.22"
semver = "1.0.28"
zip = { version = "8.2", default-features = false, features = ["deflate-flate2"] }
flate2 = "1.1"

# Image Processing
image = { version = "0.25", default-features = false, features = ["png", "bmp", "jpeg", "gif", "webp", "tiff"] }

# Time
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# System
dirs = "6.0"
# Cryptographically-strong randomness for the local media server gate token.
getrandom = "0.4"
open = "5.3"
sys-locale = "0.3"
winreg = "0.56"
auto-launch = "0.6"
urlencoding = "2.1"

# Language Data
isolang = { package = "sgt-language-catalog", path = "native/language_catalog" }
unicode-normalization = "0.1"
encoding_rs = "0.8"

# GUI & Media
eframe = { version = "0.34", default-features = false, features = ["wgpu_no_default_features"] }
egui-snarl = { path = "libs/egui-snarl", features = ["serde"] }
tray-icon = "0.24.1"
cpal = "0.18"
hound = "3.5"
wasapi = "0.23"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "ogg", "wav", "aac", "alac", "pcm", "isomp4", "aiff", "vorbis", "adpcm"] }
symphonia-adapter-libopus = "0.2.6"

# Markdown Rendering
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
wry = "0.55"
raw-window-handle = "0.6"
windows-core = "0.62"
sgt-local-asr-protocol = { path = "native/local_asr_protocol" }
sgt-recorder-protocol = { path = "native/recorder_protocol" }
sgt-computer-control-protocol = { path = "native/computer_control_protocol" }
sgt-screen-text-detector-protocol = { path = "native/screen_text_detector_protocol" }
parking_lot = "0.12"
libloading = "0.8"

# GPU Rendering
wgpu = { version = "29", default-features = false, features = ["std", "dx12", "wgsl"] }

[dev-dependencies]
resvg = { version = "0.47", default-features = false }

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Dwm",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_JobObjects",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_Storage_FileSystem",
    "Win32_Media",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_Xps",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Devices_Enumeration",
    "Media_Capture",
    "Media_MediaProperties",
    "Storage",
    "Storage_Streams",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = "symbols"
debug = 1
panic = "unwind"

[profile.dev]
# Keep panic backtraces (file:line) but drop bulky symbol data to shrink target/.
debug = "line-tables-only"

[patch.crates-io]
egui-wgpu = { path = "third_party/egui-wgpu" }
egui-scale = { path = "libs/egui-scale" }
wgpu-hal = { path = "third_party/wgpu-hal" }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38.2"
# Same windows version webview2-com binds against. The Computer Control orb hosts WebView2 in
# DirectComposition mode (WS_EX_NOREDIRECTIONBITMAP) for true transparency that coexists with
# WDA_EXCLUDEFROMCAPTURE; doing the DComp device/visual on 0.61 too avoids cross-version COM casts.
windows061 = { package = "windows", version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }
