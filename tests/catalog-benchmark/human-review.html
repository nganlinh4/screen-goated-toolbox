<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGT catalog review bench</title>
<style>
:root{--ink:#e8edf6;--muted:#95a2b5;--panel:#151c28;--raised:#1c2635;--line:#2e3b4e;--cyan:#68dfd1;--amber:#f1bd6b;--red:#f37b82;--green:#78d69b;color-scheme:dark;font-family:"Segoe UI Variable","Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:#0e141e;color:var(--ink)}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #b7d3ff;outline-offset:2px}.empty{min-height:100vh;display:grid;place-items:center;padding:32px;background:linear-gradient(135deg,#101724 0 52%,#121b28 52%)}.drop{width:min(720px,100%);padding:54px;border:1px solid var(--line);background:var(--panel);box-shadow:14px 14px 0 #0a0f17}.drop strong{display:block;font:650 34px/1.08 "Segoe UI Variable Display",sans-serif}.drop p{color:var(--muted);max-width:60ch;line-height:1.6}.load,.export,.next{border:1px solid #5479aa;background:#26466d;padding:10px 15px}.shell{display:none;min-height:100vh;grid-template-columns:286px minmax(0,1fr)}.sidebar{position:sticky;top:0;height:100vh;overflow:auto;padding:24px 18px;background:#111925;border-right:1px solid var(--line)}.brand{font:700 20px/1.1 "Segoe UI Variable Display",sans-serif}.brand small{display:block;margin-top:7px;color:var(--cyan);font:12px/1.2 "Cascadia Mono",monospace;letter-spacing:.08em}.meter{height:5px;margin:22px 0 8px;background:#273245}.meter i{display:block;height:100%;width:0;background:var(--cyan);transition:width .18s}.progress{color:var(--muted);font:12px/1.3 "Cascadia Mono",monospace}.case-list{display:grid;gap:7px;margin:22px 0}.case-link{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;width:100%;padding:9px 8px;border:1px solid transparent;background:transparent;text-align:left;color:var(--muted)}.case-link b{font:12px/1 "Cascadia Mono",monospace;color:#60718a}.case-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.case-link em{font:normal 11px/1 "Cascadia Mono",monospace}.case-link.active{color:var(--ink);border-color:#40516a;background:#1a2534}.case-link.done em{color:var(--green)}.actions{display:grid;gap:8px}.actions button{width:100%}.export{background:#255f55;border-color:#3b8f81}.main{min-width:0;padding:28px clamp(20px,4vw,58px) 80px}.case-head{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:end}.eyebrow{color:var(--amber);font:12px/1.2 "Cascadia Mono",monospace;letter-spacing:.1em}h1{margin:8px 0 0;font:680 clamp(26px,4vw,44px)/1 "Segoe UI Variable Display",sans-serif;letter-spacing:-.035em}.case-head input{width:min(280px,35vw);border:1px solid var(--line);background:#111925;color:var(--ink);padding:10px 12px}.reference{margin:25px 0;padding:17px 20px;border-left:4px solid var(--amber);background:#171d26;white-space:pre-wrap;line-height:1.52}.reference span{display:block;margin-bottom:8px;color:var(--amber);font:11px/1 "Cascadia Mono",monospace}.cards{display:grid;gap:16px}.card{border:1px solid var(--line);background:var(--panel)}.card.complete{border-color:#365d55}.card-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--raised)}.model{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 13px/1.2 "Cascadia Mono",monospace}.stamp{color:var(--muted);font:11px/1 "Cascadia Mono",monospace}.response{padding:18px 20px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.56}.rubrics{display:grid;gap:8px;padding:0 20px 17px}.rubric{display:flex;gap:9px;align-items:start;color:#c7d0dd;font-size:13px;line-height:1.4}.rubric input{margin-top:3px;accent-color:var(--cyan)}.judge{display:flex;flex-wrap:wrap;gap:8px;padding:13px 16px;border-top:1px solid var(--line);background:#121a26}.judge button{border:1px solid #3b4960;background:#1d2939;padding:7px 10px}.judge button.selected{border-color:#72a7ff;background:#29466c}.judge .pass.selected{border-color:var(--green);background:#235440}.judge .partial.selected{border-color:var(--amber);background:#5a4322}.judge .fail.selected{border-color:var(--red);background:#642e35}.rating{display:flex;gap:4px;margin-left:6px}.quick{margin-left:auto!important;color:var(--cyan)}.hidden{display:none!important}.toast{position:fixed;right:24px;bottom:24px;padding:11px 14px;background:#23463f;border:1px solid #3c766b;transform:translateY(90px);transition:transform .2s}.toast.show{transform:translateY(0)}@media(max-width:780px){.shell{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}.case-list{grid-template-columns:repeat(2,minmax(0,1fr))}.case-head{grid-template-columns:1fr}.case-head input{width:100%}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<section class="empty" id="empty"><div class="drop"><strong>Catalog review bench</strong><p>Load <code>review-template.json</code> or an in-progress <code>reviews.json</code>. Progress stays in this browser; export produces the exact structured review file consumed by the benchmark.</p><button class="load" id="load">Load review file</button><input class="hidden" id="file" type="file" accept="application/json,.json"></div></section>
<div class="shell" id="shell"><aside class="sidebar"><div class="brand">SGT review bench<small>HUMAN / PROTOCOL 13</small></div><div class="meter"><i id="meter"></i></div><div class="progress" id="progress">0 / 0 reviewed</div><nav class="case-list" id="caseList"></nav><div class="actions"><button class="next" id="next">Next unfinished</button><button class="export" id="export">Export reviews.json</button><button class="load" id="replace">Load another file</button></div></aside><main class="main"><header class="case-head"><div><div class="eyebrow" id="caseIndex"></div><h1 id="caseTitle"></h1></div><input id="filter" type="search" placeholder="Filter models" aria-label="Filter models"></header><div class="reference"><span>REFERENCE</span><div id="reference"></div></div><section class="cards" id="cards"></section></main></div><div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);let data,cases=[],active=0,key="";
const complete=r=>["pass","partial","fail"].includes(r.verdict)&&Number.isInteger(r.rating)&&r.rating>=1&&r.rating<=5&&r.rubric_checks.length===r.rubric.length&&r.rubric_checks.every(v=>typeof v==="boolean");
function validate(v){if(v?.version!==1||!Array.isArray(v.reviews)||!v.reviews.length)throw Error("Expected a version 1 review file with entries.");for(const r of v.reviews)if(!r.model_id||!r.case_id||!Array.isArray(r.rubric)||!Array.isArray(r.rubric_checks))throw Error("A review entry is missing its identity or rubric.")}
function signature(v){let hash=2166136261;const text=JSON.stringify(v.reviews.map(r=>[r.model_id,r.case_id,r.response,r.reference,r.rubric]));for(let i=0;i<text.length;i++){hash^=text.charCodeAt(i);hash=Math.imul(hash,16777619)}return`${v.version}|${v.reviews.length}|${(hash>>>0).toString(16)}`}
function group(){const m=new Map;for(const r of data.reviews){if(!m.has(r.case_id))m.set(r.case_id,[]);m.get(r.case_id).push(r)}cases=[...m].map(([id,reviews])=>({id,reviews}))}
function save(){localStorage.setItem(key,JSON.stringify(data));progress()}
function progress(){const done=data.reviews.filter(complete).length,total=data.reviews.length;$("#meter").style.width=`${done/total*100}%`;$("#progress").textContent=`${done} / ${total} reviewed`;$("#export").textContent=done===total?"Export completed reviews.json":"Export draft reviews.json";caseList()}
function title(id){return id.replace(/^text-\d+-/,"").replaceAll("-"," ")}
function caseList(){const list=$("#caseList");list.replaceChildren(...cases.map((c,i)=>{const done=c.reviews.filter(complete).length,b=document.createElement("button");b.className=`case-link${i===active?" active":""}${done===c.reviews.length?" done":""}`;b.innerHTML=`<b>${String(i+1).padStart(2,"0")}</b><span></span><em>${done}/${c.reviews.length}</em>`;b.querySelector("span").textContent=title(c.id);b.onclick=()=>{active=i;render();scrollTo({top:0,behavior:"smooth"})};return b}))}
function verdict(r,value,label){const b=document.createElement("button");b.className=`${value}${r.verdict===value?" selected":""}`;b.textContent=label;b.onclick=()=>{r.verdict=value;save();cards()};return b}
function reviewCard(r){const a=document.createElement("article");a.className=`card${complete(r)?" complete":""}`;const top=document.createElement("div");top.className="card-top";const model=document.createElement("div");model.className="model";model.textContent=r.model_id;const stamp=document.createElement("div");stamp.className="stamp";stamp.textContent=complete(r)?`${r.verdict} · ${r.rating}/5`:"unfinished";top.append(model,stamp);const response=document.createElement("div");response.className="response";response.textContent=r.response;const rubrics=document.createElement("div");rubrics.className="rubrics";r.rubric.forEach((text,i)=>{const label=document.createElement("label");label.className="rubric";const input=document.createElement("input");input.type="checkbox";input.checked=r.rubric_checks[i]===true;input.indeterminate=r.rubric_checks[i]==null;input.onchange=()=>{r.rubric_checks[i]=input.checked;save();cards()};label.append(input,document.createTextNode(text));rubrics.append(label)});const judge=document.createElement("div");judge.className="judge";judge.append(verdict(r,"pass","Pass"),verdict(r,"partial","Partial"),verdict(r,"fail","Fail"));const rating=document.createElement("div");rating.className="rating";for(let n=1;n<=5;n++){const b=document.createElement("button");b.textContent=n;if(r.rating===n)b.classList.add("selected");b.onclick=()=>{r.rating=n;save();cards()};rating.append(b)}const exact=document.createElement("button");exact.className="quick";exact.textContent="Exact pass";exact.title="Pass, 5/5, all rubric checks true";exact.onclick=()=>{r.verdict="pass";r.rating=5;r.rubric_checks=r.rubric.map(()=>true);save();cards()};const fail=document.createElement("button");fail.textContent="Clear fail";fail.title="Fail, 1/5, all rubric checks false";fail.onclick=()=>{r.verdict="fail";r.rating=1;r.rubric_checks=r.rubric.map(()=>false);save();cards()};judge.append(rating,exact,fail);a.append(top,response,rubrics,judge);return a}
function cards(){const q=$("#filter").value.trim().toLowerCase(),rows=cases[active].reviews.filter(r=>r.model_id.toLowerCase().includes(q));$("#cards").replaceChildren(...rows.map(reviewCard))}
function render(){const c=cases[active];$("#caseIndex").textContent=`CASE ${active+1} OF ${cases.length} · ${c.reviews.length} MODELS`;$("#caseTitle").textContent=title(c.id);$("#reference").textContent=c.reviews[0].reference??"(none)";caseList();cards()}
function next(){for(let offset=0;offset<cases.length;offset++){const i=(active+offset)%cases.length;if(cases[i].reviews.some(r=>!complete(r))){active=i;render();return}}toast("Every review is complete.")}
function exportFile(){const blob=new Blob([JSON.stringify(data,null,2)+"\n"],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="reviews.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast("Exported reviews.json")}
function toast(message){const n=$("#toast");n.textContent=message;n.classList.add("show");setTimeout(()=>n.classList.remove("show"),1800)}
async function load(selected){try{const incoming=JSON.parse(await selected.text());validate(incoming);key=`sgt-catalog-review:${signature(incoming)}`;const raw=localStorage.getItem(key),saved=raw?JSON.parse(raw):null;if(saved)validate(saved);data=saved&&saved.reviews.filter(complete).length>incoming.reviews.filter(complete).length?saved:incoming;group();active=0;$("#empty").style.display="none";$("#shell").style.display="grid";progress();render();if(data===saved)toast("Restored newer local review progress")}catch(error){toast(error.message||"Could not load that review file.")}}
$("#load").onclick=$("#replace").onclick=()=>$("#file").click();$("#file").onchange=e=>e.target.files[0]&&load(e.target.files[0]);$("#next").onclick=next;$("#export").onclick=exportFile;$("#filter").oninput=cards;document.addEventListener("keydown",e=>{if(!data||e.target.matches("input"))return;if(e.altKey&&e.key==="ArrowRight"){active=(active+1)%cases.length;render()}if(e.altKey&&e.key==="ArrowLeft"){active=(active-1+cases.length)%cases.length;render()}});
</script>
</body>
</html>
