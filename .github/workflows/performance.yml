name: Performance contracts

on:
  workflow_dispatch:
    inputs:
      action:
        description: Performance lane to execute
        type: choice
        options:
          - Compare
          - TrainPgo
        default: Compare
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: performance-contracts
  cancel-in-progress: false

jobs:
  windows-profiles:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: llvm-tools-preview
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: translation-gummy-ui/package-lock.json
      - name: Restore pinned patched egui dependencies
        shell: pwsh
        run: ./scripts/setup-egui-snarl.ps1
      - name: Build compile-time translation assets
        shell: pwsh
        run: |
          Push-Location translation-gummy-ui
          try {
            npm ci
            if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
            npm run build
            if ($LASTEXITCODE -ne 0) { throw "translation asset build failed" }
          } finally {
            Pop-Location
          }
          New-Item -ItemType Directory -Force src/overlay/translation_gummy/dist | Out-Null
          Copy-Item -Recurse -Force translation-gummy-ui/dist/* src/overlay/translation_gummy/dist/
      - name: Run Windows performance lane
        shell: pwsh
        env:
          SGT_DEV_CACHE_ROOT: ${{ runner.temp }}/sgt-performance-artifacts
          PERFORMANCE_ACTION: ${{ github.event_name == 'workflow_dispatch' && inputs.action || 'Compare' }}
        run: ./scripts/windows-performance.ps1 -Action $env:PERFORMANCE_ACTION -Runs 3
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: windows-performance-contracts
          path: |
            ${{ runner.temp }}/sgt-performance-artifacts/performance/windows-*.json
            ${{ runner.temp }}/sgt-performance-artifacts/performance/pgo-*/pgo-report.json
            ${{ runner.temp }}/sgt-performance-artifacts/performance/pgo-*/merged.profdata
            ${{ runner.temp }}/sgt-performance-artifacts/performance/pgo-*/screen-goated-toolbox-pgo.exe
          if-no-files-found: ignore
