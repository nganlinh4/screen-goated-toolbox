name: Monitor NVIDIA availability

# Publishes which NVIDIA endpoints answer, answer correctly, and with which
# reasoning control. Latency is included only as a coarse ranking hint: this
# runner measures from one datacenter, while clients sit on the user's network
# and already record their own per-call latency.
#
# The signing key here is deliberately NOT the update-catalog key. That one signs
# runtime bundles, and this job runs unattended every two hours; a feed that only
# influences model routing must not share a key with something that delivers
# executables.

on:
  schedule:
    - cron: "17 */2 * * *" # off the hour, so it does not pile onto the :00 rush
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-nvidia-availability
  cancel-in-progress: false # a partial run would corrupt the streak counters

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check ecdsa==0.19.1

      - name: Probe every model and update the rolling history
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python scripts/monitor_nvidia_models.py \
            --history monitoring/nvidia-history.json \
            --output monitoring/nvidia-availability.json \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Sign the published feed
        env:
          SGT_MONITORING_P256_PRIVATE_KEY_PEM_BASE64: ${{ secrets.SGT_MONITORING_P256_PRIVATE_KEY_PEM_BASE64 }}
        run: |
          python scripts/sign_monitoring_feed.py \
            --input monitoring/nvidia-availability.json \
            --public-key monitoring/monitoring-p256-public-key.hex

      - name: Commit only when the published feed changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sgt-monitoring"
          git config user.email "sgt-monitoring@users.noreply.github.com"
          git add monitoring/
          # The history file changes every run by design; publishing on that
          # alone would rewrite the feed hourly with no new information.
          if git diff --cached --quiet -- monitoring/nvidia-availability.json; then
            echo "eligibility unchanged; recording history only"
          fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore(monitoring): refresh NVIDIA availability feed"
          git push
