name: Monitor NVIDIA availability

# Publishes which NVIDIA endpoints answer, which general modality they accept,
# and with which reasoning control. Preset output is never a catalog-wide gate.
# Latency is included only as a coarse ranking hint: this
# runner measures from one datacenter, while clients sit on the user's network
# and already record their own per-call latency.
#
# Data is published to the `monitoring-feed` branch, never to `main`. A job that
# commits every two hours and a human pushing to the same branch collide
# constantly: in one day this produced eleven of twenty-nine commits on `main` and
# forced a merge on every push.
#
# The signing key here is deliberately NOT the update-catalog key. That one signs
# runtime bundles, and this job runs unattended every two hours; a feed that only
# influences model routing must not share a key with something that delivers
# executables.

on:
  schedule:
    - cron: "17 */2 * * *" # off the hour, so it does not pile onto the :00 rush
  workflow_dispatch:
    inputs:
      models:
        description: Optional comma-separated endpoint ids for a focused signed probe
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: monitor-nvidia-availability
  cancel-in-progress: false # a partial run would corrupt the streak counters

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # The data branch is checked out beside the code, so the run reads scripts
      # and fixtures from main while writing only into the feed branch.
      - uses: actions/checkout@v5
        with:
          ref: monitoring-feed
          path: feed

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install signing dependency
        run: python -m pip install --disable-pip-version-check ecdsa==0.19.1

      - name: Probe every model and update the rolling history
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SELECTED_MODELS: ${{ inputs.models }}
        run: |
          args=()
          if [[ -n "$SELECTED_MODELS" ]]; then
            args+=(--models "$SELECTED_MODELS")
          fi
          python scripts/monitor_nvidia_models.py \
            --history feed/nvidia-history.json \
            --output feed/nvidia-availability.json \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${args[@]}"

      - name: Sign the published feed
        env:
          SGT_MONITORING_P256_PRIVATE_KEY_PEM_BASE64: ${{ secrets.SGT_MONITORING_P256_PRIVATE_KEY_PEM_BASE64 }}
        run: |
          python scripts/sign_monitoring_feed.py \
            --input feed/nvidia-availability.json \
            --public-key monitoring/monitoring-p256-public-key.hex

      - name: Publish to the data branch
        working-directory: feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sgt-monitoring"
          git config user.email "sgt-monitoring@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git commit -m "chore(monitoring): refresh NVIDIA availability feed"
          # A single writer owns this branch, so a rebase only ever replays onto
          # a run that raced this one.
          git pull --rebase --quiet origin monitoring-feed || true
          git push origin HEAD:monitoring-feed
